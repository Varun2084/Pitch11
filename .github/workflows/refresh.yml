name: Daily refresh
on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the metric rules
        run: python -W ignore tests/test_build.py
      - name: Check the data builds and passes integrity checks
        run: |
          python pipeline/build.py --out web/data
          python pipeline/news.py --out web/data
          python pipeline/report.py web/data
      - name: Ask Netlify to rebuild
        run: |
          date -u +%FT%TZ > data/last_refresh.txt
          git config user.name "pitchxi-bot"
          git config user.email "pitchxi-bot@users.noreply.github.com"
          git add data/last_refresh.txt
          git commit -m "Daily data refresh"
          git push
